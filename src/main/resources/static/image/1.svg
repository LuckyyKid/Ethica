<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:0.4"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="24"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="80" r="120" fill="url(#glowGrad)" opacity="0.5"/>
  <circle cx="150" cy="420" r="80" fill="#7c3aed" opacity="0.1"/>
  
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="280" x2="700" y2="280"/>
    <line x1="100" y1="210" x2="700" y2="210"/>
    <line x1="100" y1="140" x2="700" y2="140"/>
  </g>
  
  <!-- Chart area fill -->
  <path d="M100,350 L150,320 L200,330 L250,290 L300,300 L350,250 L400,220 L450,200 L500,180 L550,150 L600,130 L650,100 L700,80 L700,350 Z" fill="url(#chartGrad)"/>
  
  <!-- Chart line -->
  <path d="M100,350 L150,320 L200,330 L250,290 L300,300 L350,250 L400,220 L450,200 L500,180 L550,150 L600,130 L650,100 L700,80" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Data points -->
  <g fill="#4a9eff">
    <circle cx="350" cy="250" r="6" filter="url(#glow)"/>
    <circle cx="500" cy="180" r="6" filter="url(#glow)"/>
    <circle cx="650" cy="100" r="6" filter="url(#glow)"/>
  </g>
  
  <!-- Card overlay - Portfolio summary -->
  <g transform="translate(500, 280)">
    <rect width="180" height="100" rx="12" fill="rgba(24,24,27,0.9)" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="28" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="11" letter-spacing="0.5">PORTFOLIO VALUE</text>
    <text x="16" y="55" fill="#fafafa" font-family="system-ui" font-size="24" font-weight="600">$124,580</text>
    <text x="16" y="80" fill="#22c55e" font-family="system-ui" font-size="13">↑ +12.4% this month</text>
  </g>
  
  <!-- Ethics badge -->
  <g transform="translate(80, 60)">
    <rect width="160" height="50" rx="25" fill="rgba(74,158,255,0.15)" stroke="rgba(74,158,255,0.3)"/>
    <circle cx="30" cy="25" r="12" fill="url(#accentGrad)"/>
    <text x="30" y="29" fill="#fff" font-family="system-ui" font-size="12" text-anchor="middle">✓</text>
    <text x="55" y="30" fill="#4a9eff" font-family="system-ui" font-size="13" font-weight="500">ESG Compliant</text>
  </g>
  
  <!-- Values icons -->
  <g transform="translate(100, 380)">
    <rect width="120" height="40" rx="8" fill="rgba(255,255,255,0.05)"/>
    <text x="15" y="26" fill="#fafafa" font-size="16">🌱</text>
    <text x="40" y="27" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="12">Environment</text>
  </g>
  <g transform="translate(240, 380)">
    <rect width="100" height="40" rx="8" fill="rgba(255,255,255,0.05)"/>
    <text x="15" y="26" fill="#fafafa" font-size="16">⚖️</text>
    <text x="40" y="27" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="12">Ethics</text>
  </g>
  <g transform="translate(360, 380)">
    <rect width="100" height="40" rx="8" fill="rgba(255,255,255,0.05)"/>
    <text x="15" y="26" fill="#fafafa" font-size="16">🤝</text>
    <text x="40" y="27" fill="rgba(255,255,255,0.7)" font-family="system-ui" font-size="12">Social</text>
  </g>
</svg>
