<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="successGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg4)" rx="20"/>
  
  <!-- Main card -->
  <g transform="translate(30, 50)">
    <rect width="340" height="300" rx="16" fill="rgba(24,24,27,0.6)" stroke="rgba(255,255,255,0.08)"/>
    
    <!-- Header -->
    <text x="24" y="35" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="11" letter-spacing="1">YOUR PORTFOLIO</text>
    
    <!-- Value -->
    <text x="24" y="70" fill="#fafafa" font-family="system-ui" font-size="28" font-weight="600">$84,230</text>
    <text x="160" y="70" fill="#22c55e" font-family="system-ui" font-size="14">+18.2%</text>
    
    <!-- Alignment badge -->
    <g transform="translate(230, 20)">
      <rect width="90" height="30" rx="15" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.3)"/>
      <circle cx="20" cy="15" r="8" fill="url(#successGrad)"/>
      <text x="20" y="19" text-anchor="middle" fill="#fff" font-size="10">✓</text>
      <text x="58" y="19" text-anchor="middle" fill="#22c55e" font-family="system-ui" font-size="11">Aligned</text>
    </g>
    
    <!-- Mini chart -->
    <g transform="translate(24, 100)">
      <!-- Chart area -->
      <path d="M0,100 L40,85 L80,90 L120,70 L160,60 L200,45 L240,35 L280,20 L292,15 L292,100 Z" fill="url(#chartFill)"/>
      <!-- Chart line -->
      <path d="M0,100 L40,85 L80,90 L120,70 L160,60 L200,45 L240,35 L280,20 L292,15" fill="none" stroke="url(#successGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#successGlow)"/>
      <!-- End dot -->
      <circle cx="292" cy="15" r="5" fill="#22c55e" filter="url(#successGlow)"/>
    </g>
    
    <!-- Holdings -->
    <g transform="translate(24, 220)">
      <text fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10" letter-spacing="1">TOP HOLDINGS</text>
      
      <!-- Holding 1 -->
      <g transform="translate(0, 25)">
        <rect width="292" height="40" rx="8" fill="rgba(255,255,255,0.03)"/>
        <circle cx="20" cy="20" r="12" fill="rgba(74,158,255,0.2)"/>
        <text x="20" y="24" text-anchor="middle" fill="#4a9eff" font-size="10">🌱</text>
        <text x="45" y="18" fill="#fafafa" font-family="system-ui" font-size="12">Clean Energy ETF</text>
        <text x="45" y="32" fill="rgba(255,255,255,0.5)" font-family="system-ui" font-size="10">ESG Score: 92</text>
        <text x="260" y="24" fill="#22c55e" font-family="system-ui" font-size="12">+24.5%</text>
      </g>
    </g>
  </g>
  
  <!-- Floating elements -->
  <g transform="translate(350, 80)">
    <circle r="25" fill="rgba(124,58,237,0.2)"/>
    <text y="5" text-anchor="middle" fill="#fafafa" font-size="18">📊</text>
  </g>
  
  <g transform="translate(50, 370)">
    <circle r="20" fill="rgba(74,158,255,0.2)"/>
    <text y="5" text-anchor="middle" fill="#fafafa" font-size="14">💎</text>
  </g>
</svg>
