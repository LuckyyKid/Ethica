<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My portfolio - Ethica</title>
    <link rel="stylesheet" th:href="@{/css/clientPortfolio.css}">
</head>
<body>
<header>
    <nav class="navbar">
        <div class="logo">
            <a th:href="@{/}" class="logo-text">Ethica</a>
        </div>
        <ul class="nav">
            <li><a th:href="@{/dashboard}">Home</a></li>
            <li><a th:href="@{/about}">About Us</a></li>
            <li><a th:href="@{/founder}">Price</a></li>
            <li><a th:href="@{/news}">News</a></li>
            <li><a th:href="@{/signUp}">Sign Up</a></li>
            <li><a th:href="@{/login}">Log out</a></li>
        </ul>
    </nav>
</header>

<main class="dashboard-container">
    <!-- Graph -->
    <div class="left-panel">
        <h2>Evolution of your balance</h2>
        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <!-- trades history -->
    <div class="right-panel">
        <h2>Most recent Transactions</h2>
        <div class="table-wrapper">
            <table class="trade-table">
                <thead>
                <tr>
                    <th>Type</th>
                    <th>Symbol</th>
                    <th>Quantity</th>
                    <th>Value ($)</th>
                    <th>Date</th>
                </tr>
                </thead>
                <tbody id="transactionsBody">
                <tr th:each="trade, iterStat : ${trades}" th:classappend="${iterStat.index ge 5} ? 'hidden-row hidden' : ''">
                    <td th:text="${trade.buy} ? 'Buy' : 'Sell'" th:class="${trade.buy} ? 'type-buy' : 'type-sell'"></td>
                    <td th:text="${trade.symbol}" class="symbol"></td>
                    <td th:text="${trade.quantity}"></td>
                    <td class="value" th:text="${'$' + #numbers.formatDecimal(trade.quantity * trade.priceAtExecution, 1, 2)}"></td>
                    <td th:text="${#temporals.format(trade.timestamp, 'dd/MM/yyyy HH:mm')}" class="date"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <button id="showAllBtn" class="btn-show-all" th:if="${#lists.size(trades) gt 5}">
            <span id="btnText">Show all transactions</span>
            <span id="btnCount" th:text="'(' + ${#lists.size(trades)} + ')'"></span>
        </button>

        <div class="buttons">
            <a th:href="@{/trading}" class="btn btn-buy">Buy</a>
            <a th:href="@{/trading}" class="btn btn-sell">Sell</a>
            <a th:href="@{/dashboard}" class="btn btn-exit">Exit</a>
        </div>
    </div>
</main>

<script th:src="@{/js/chart.min.js}" defer></script>


<script th:src="@{/js/transactions.js}" defer></script>
<script th:src="@{/js/portfolioChart.js}" defer></script>

</body>
</html>
