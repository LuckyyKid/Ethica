<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Login - Ethica</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<header>
    <nav class="navbar">
        <div class="logo">
            <a th:href="@{/}" class="logo-text">Ethica</a>
        </div>
        <ul class="nav">
            <li><a th:href="@{/}">Home</a></li>
            <li><a th:href="@{/about}">About</a></li>
            <li><a th:href="@{/news}">News</a></li>
            <li><a th:href="@{/signUp}">Sign Up</a></li>
            <li><a th:href="@{/login}">Login</a></li>
        </ul>
    </nav>
</header>

<main class="form">
    <form id="loginForm" th:action="@{/login}" method="post">

        <!-- Title -->
        <h1 class="form-title">Welcome back</h1>
        <p class="form-subtitle">Sign in to your account</p>

        <!-- Error Message -->
        <div th:if="${error}" class="error-message" id="popupError" th:text="${error}">
            Invalid password or unknown user
        </div>

        <!-- Email -->
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="you@example.com"
                   required
                   autocomplete="email"
                   inputmode="email">
        </div>

        <!-- Password -->
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="••••••••"
                   required
                   autocomplete="current-password">
        </div>

        <!-- Submit Button -->
        <button type="submit">Sign In</button>

        <!-- Footer Link -->
        <p class="form-footer">
            Don't have an account? <a th:href="@{/signUp}">Sign up</a>
        </p>
    </form>
</main>

<footer class="footer">
    <div class="footer-container">
        <div class="footer-left">
            <h4>Ethica</h4>
            <p>&copy; 2025 Ethica Inc. All rights reserved.</p>
        </div>
        <div class="footer-links">
            <ul>
                <li><a th:href="@{/about}">About Us</a></li>
                <li><a href="#">Privacy</a></li>
                <li><a href="#">Terms</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
        <div class="footer-socials">
            <p>Follow us</p>
            <a href="https://linkedin.com" target="_blank">LinkedIn</a> |
            <a href="https://twitter.com" target="_blank">Twitter</a>
        </div>
    </div>
</footer>

</body>
</html>
